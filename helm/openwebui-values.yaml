# openwebui-values.yaml

replicaCount: 1

# Ollama is deployed separately using otwld/ollama
ollama:
  enabled: false

# Connect Open WebUI to the separate Ollama release
ollamaUrls:
  - http://ollama.llm.svc.cluster.local:11434

websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

persistence:
  enabled: true
  size: 5Gi
  storageClass: gp3-csi

# Run Open WebUI on the dedicated LLM node group
nodeSelector:
  role: llm

tolerations:
  - key: "workload"
    operator: "Equal"
    value: "llm"
    effect: "NoSchedule"

# Not needed for this playground
pipelines:
  enabled: false
